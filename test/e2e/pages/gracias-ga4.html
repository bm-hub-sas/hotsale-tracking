<h1>Tienda — gracias por su compra</h1>
<!-- GA4: an earlier purchase left in the dataLayer (single-page checkout), then the real one. The last one must win. -->
<script>
  window.dataLayer = window.dataLayer || [];
  dataLayer.push({ event: 'purchase', ecommerce: { transaction_id: 'OLD-0001', value: 1000, currency: 'COP' } });
  dataLayer.push({ ecommerce: null });
  dataLayer.push({ event: 'purchase', ecommerce: { transaction_id: 'HS-1001', value: 250000, currency: 'COP', items: [{ item_id: 'SKU-1', price: 250000, quantity: 1 }] } });
</script>
